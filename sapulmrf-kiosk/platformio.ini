; PlatformIO build for the kiosk firmware. Mirrors the Arduino IDE settings in SapulMRF_Kiosk.ino:
; ESP32S3 Dev Module, OPI PSRAM, 16MB QIO flash, Huge APP partition, USB CDC on boot.
; The sketch stays in SapulMRF_Kiosk/, so the Arduino IDE still opens it unchanged.

[platformio]
src_dir = SapulMRF_Kiosk

[env:kiosk]
; GFX Library 1.6 needs ESP32 Arduino core 3.x, which only the pioarduino platform ships (core 3.3.12)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; lvgl finds SapulMRF_Kiosk/lv_conf.h here, instead of copying it next to the library
  -DLV_CONF_INCLUDE_SIMPLE
  -I SapulMRF_Kiosk
lib_deps =
  moononournation/GFX Library for Arduino@^1.6.0
  lvgl/lvgl@~8.3.11
  tamctec/TAMC_GT911
  bitbank2/JPEGDEC
  bblanchon/ArduinoJson@^7
  bogde/HX711
